name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build mcp-layer-rules-azure.sln -c Release -warnaserror
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python measure/list_tools.py --offline src/StayMcp/Tools/StayTools.cs
